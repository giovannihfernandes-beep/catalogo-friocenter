<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FrioCenter Pescados — Catálogo de Produtos</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root {
  --bg:       #081428;
  --surface:  #0F2545;
  --surface-2:#153057;
  --line:     #284B79;
  --text:     #F3F6FA;
  --muted:    #93A9C8;
  --gold:     #FFC607;
  --gold-soft:#3D2E05;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  padding: 40px 24px 80px;
  min-height: 100vh;
}

/* ── FUNDO DECORATIVO ── */
.bg-art { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; overflow: hidden; }
.bg-art svg { position: absolute; color: var(--gold); opacity: 0.05; }

/* ── LAYOUT ── */
.wrap { max-width: 1080px; margin: 0 auto; position: relative; z-index: 1; }

/* ── HEADER ── */
header { margin-bottom: 36px; }
.brand-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.brand-icon {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--gold); box-shadow: 0 0 0 2px var(--gold);
  display: flex; align-items: center; justify-content: center; font-size: 20px;
}
.eyebrow {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--muted);
}
h1 {
  font-family: 'Fraunces', serif; font-weight: 600;
  font-size: clamp(26px, 4vw, 38px); margin: 0 0 8px;
  letter-spacing: -.01em;
}
.subtitle { color: var(--muted); font-size: 15px; max-width: 620px; line-height: 1.6; }

/* ── FILTROS ── */
.filters { display: flex; gap: 10px; margin: 28px 0 20px; flex-wrap: wrap; align-items: center; }

.search-input {
  flex: 1; min-width: 220px;
  background: var(--surface); border: 1px solid var(--line);
  color: var(--text); padding: 10px 14px; border-radius: 8px;
  font-size: 14px; font-family: 'Inter', sans-serif;
  transition: border-color .15s;
}
.search-input:focus { outline: none; border-color: var(--gold); }
.search-input::placeholder { color: var(--muted); }

.cat-filters { display: flex; gap: 8px; flex-wrap: wrap; }
.cat-btn {
  font-family: 'IBM Plex Mono', monospace; font-size: 12px;
  background: var(--surface); border: 1px solid var(--line);
  color: var(--muted); padding: 8px 14px; border-radius: 8px;
  cursor: pointer; transition: all .15s; white-space: nowrap;
}
.cat-btn:hover { color: var(--text); border-color: #3a5a8a; }
.cat-btn.active { background: var(--gold); color: #0A1730; border-color: var(--gold); font-weight: 600; }

/* ── CONTAGEM ── */
.result-count {
  font-family: 'IBM Plex Mono', monospace; font-size: 12px;
  color: var(--muted); margin-bottom: 16px; letter-spacing: .04em;
}

/* ── GRID DE CARDS ── */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }

.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 14px; overflow: hidden;
  cursor: pointer; transition: border-color .15s, transform .15s, box-shadow .15s;
}
.card:hover {
  border-color: var(--gold);
  transform: translateY(-3px);
  box-shadow: 0 8px 32px rgba(255, 198, 7, 0.08);
}

.card-img-wrap { position: relative; width: 100%; height: 200px; overflow: hidden; background: var(--surface-2); }
.card-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s; }
.card:hover .card-img-wrap img { transform: scale(1.04); }

.no-img {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 8px; color: var(--muted); font-size: 13px;
}
.no-img span { font-size: 28px; opacity: .4; }

.card-cat-badge {
  position: absolute; top: 10px; left: 10px;
  font-family: 'IBM Plex Mono', monospace; font-size: 10px;
  letter-spacing: .06em; text-transform: uppercase;
  background: rgba(8, 20, 40, .75); color: var(--gold);
  border: 1px solid rgba(255,198,7,.3);
  padding: 3px 8px; border-radius: 20px;
  backdrop-filter: blur(4px);
}

.card-body { padding: 14px 16px 16px; }
.card-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.card-code { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .08em; color: var(--gold); }
.card-marca { font-size: 11px; color: var(--muted); }
.card-name { font-size: 13px; font-weight: 600; line-height: 1.45; color: var(--text); }

/* ── EMPTY ── */
.empty { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 14px; }
.empty-icon { font-size: 40px; display: block; margin-bottom: 12px; opacity: .4; }

/* ── MODAL ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(4, 8, 20, .88); backdrop-filter: blur(6px);
  display: none; align-items: center; justify-content: center;
  padding: 20px; z-index: 100;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 16px; max-width: 540px; width: 100%;
  overflow: hidden; box-shadow: 0 24px 64px rgba(0,0,0,.6);
  animation: modalIn .2s ease;
}
@keyframes modalIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }

.modal-img-wrap { width: 100%; height: 300px; background: #060f1e; overflow: hidden; }
.modal-img-wrap img { width: 100%; height: 100%; object-fit: contain; display: block; }
.modal-img-wrap .no-img { height: 100%; }

.modal-body { padding: 22px 24px 28px; }
.modal-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
.modal-code { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--gold); }
.modal-marca { font-size: 12px; color: var(--muted); }
.modal-cat { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 20px; padding: 2px 10px; margin-bottom: 10px; }
.modal-name { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 600; line-height: 1.3; margin-bottom: 20px; }

.modal-actions { display: flex; gap: 10px; }
.btn-primary {
  flex: 1; padding: 12px; border-radius: 8px; border: none;
  background: var(--gold); color: #0A1730;
  font-size: 13px; font-weight: 700; cursor: pointer;
  font-family: 'IBM Plex Mono', monospace; transition: opacity .15s;
  text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-primary:hover { opacity: .85; }
.btn-secondary {
  padding: 12px 20px; border-radius: 8px;
  border: 1px solid var(--line); background: none;
  color: var(--muted); font-size: 13px; cursor: pointer;
  font-family: 'IBM Plex Mono', monospace; transition: all .15s;
}
.btn-secondary:hover { color: var(--text); border-color: #4a6080; }

/* ── FOOTER ── */
footer {
  margin-top: 60px; color: var(--muted); font-size: 12px;
  line-height: 1.6; border-top: 1px solid var(--line); padding-top: 18px;
}

/* ── RESPONSIVO ── */
@media (max-width: 600px) {
  body { padding: 24px 16px 60px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .filters { flex-direction: column; }
  .search-input { min-width: unset; width: 100%; }
  .modal-actions { flex-direction: column; }
}
</style>
</head>
<body>

<!-- Fundo decorativo -->
<div class="bg-art">
  <svg viewBox="0 0 28 24" style="width:260px;top:-40px;left:-60px;transform:rotate(-8deg)" fill="none" stroke="currentColor" stroke-width="1">
    <path d="M5 12c0-4.5 5-8 12-8 5 0 8.5 3 10 8-1.5 5-5 8-10 8-7 0-12-3.5-12-8z"/>
    <path d="M5 12 1 7v10z"/>
    <circle cx="21" cy="10" r=".9" fill="currentColor" stroke="none"/>
  </svg>
  <svg viewBox="0 0 28 24" style="width:220px;top:60%;right:-50px;transform:rotate(14deg)" fill="none" stroke="currentColor" stroke-width="1">
    <path d="M4 13c0-3 6-9 14-9 4.5 0 7.5 4 9 9-1.5 5-4.5 9-9 9-8 0-14-6-14-9z"/>
    <path d="M11 4.5C12 7 12.5 10 12.5 13c0 3-.5 6-1.5 8.5"/>
    <path d="M4 13 0 8v10z"/>
  </svg>
  <svg viewBox="0 0 22 24" style="width:180px;top:20%;right:4%;transform:rotate(-18deg)" fill="none" stroke="currentColor" stroke-width="1">
    <path d="M11 21c-4-5-7-8.5-7-12.5C4 5 7 3 11 3s7 2 7 5.5c0 4-3 7.5-7 12.5z"/>
    <circle cx="9" cy="10" r=".7" fill="currentColor" stroke="none"/>
    <circle cx="13" cy="11" r=".7" fill="currentColor" stroke="none"/>
    <circle cx="11" cy="14.5" r=".7" fill="currentColor" stroke="none"/>
  </svg>
  <svg viewBox="0 0 28 24" style="width:160px;top:38%;left:-30px;transform:rotate(-5deg)" fill="none" stroke="currentColor" stroke-width="1">
    <path d="M6 12c0-3.2 4.5-6 11-6 5 0 8 2.7 9 6-1 3.3-4 6-9 6-6.5 0-11-2.8-11-6z"/>
    <circle cx="18" cy="10.5" r=".7" fill="currentColor" stroke="none"/>
    <circle cx="14" cy="13" r=".7" fill="currentColor" stroke="none"/>
  </svg>
</div>

<div class="wrap">

  <!-- CABEÇALHO -->
  <header>
    <div class="brand-row">
      <div class="brand-icon">🐟</div>
      <div class="eyebrow">Catálogo &middot; FrioCenter Pescados</div>
    </div>
    <h1>Catálogo de Produtos</h1>
    <p class="subtitle">Consulte o portfólio completo de pescados e frutos do mar. Filtre por categoria ou busque pelo nome ou código do produto.</p>
  </header>

  <!-- FILTROS -->
  <div class="filters">
    <input
      class="search-input"
      type="text"
      id="searchInput"
      placeholder="Buscar por nome, código ou marca..."
      oninput="render()"
    >
    <div class="cat-filters" id="catFilters"></div>
  </div>

  <!-- CONTAGEM -->
  <div class="result-count" id="resultCount"></div>

  <!-- GRID -->
  <div class="grid" id="grid"></div>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-img-wrap" id="modalImgWrap"></div>
    <div class="modal-body">
      <div class="modal-top">
        <span class="modal-code" id="modalCode"></span>
        <span class="modal-marca" id="modalMarca"></span>
      </div>
      <span class="modal-cat" id="modalCat"></span>
      <div class="modal-name" id="modalName"></div>
      <div class="modal-actions">
        <a class="btn-primary" id="modalBtnDl" href="#" target="_blank">⬇ Ver foto completa</a>
        <button class="btn-secondary" onclick="closeModal()">Fechar</button>
      </div>
    </div>
  </div>
</div>

<footer>
  FrioCenter Pescados &middot; Catálogo de produtos &middot;
  Estrutura preparada para integração com <code>products.json</code>.
</footer>

<script>
// ─────────────────────────────────────────────────────────────────────
// PRODUTOS
// Futuramente, substitua este array por um fetch('products.json')
// Cada produto: { codigo, nome, categoria, marca, imagem }
// imagem: URL externa (string) ou null se não houver foto
// ─────────────────────────────────────────────────────────────────────
const PRODUCTS = [
  {
    codigo:    "65415",
    nome:      "Saithe File C/Pele Cong 1 A 1.5KG CX 10KG",
    categoria: "Filés",
    marca:     "FrioCenter",
    imagem:    "https://res.cloudinary.com/umvefw3m/image/upload/v1785949704/WhatsApp_Image_2026-08-03_at_16.07.15_yss9oc.jpg"
  }
];

// ─────────────────────────────────────────────────────────────────────
// ESTADO
// ─────────────────────────────────────────────────────────────────────
let activeCategory = "Todos";

// ─────────────────────────────────────────────────────────────────────
// CATEGORIAS
// ─────────────────────────────────────────────────────────────────────
function buildCatFilters() {
  const cats = ["Todos", ...new Set(PRODUCTS.map(p => p.categoria))];
  const el = document.getElementById("catFilters");
  el.innerHTML = cats.map(c => `
    <button class="cat-btn ${c === activeCategory ? 'active' : ''}"
      onclick="setCategory('${c}')">${c}</button>
  `).join("");
}

function setCategory(cat) {
  activeCategory = cat;
  buildCatFilters();
  render();
}

// ─────────────────────────────────────────────────────────────────────
// RENDER GRID
// ─────────────────────────────────────────────────────────────────────
function render() {
  const q = (document.getElementById("searchInput").value || "").toLowerCase().trim();

  const items = PRODUCTS.filter(p => {
    const matchCat = activeCategory === "Todos" || p.categoria === activeCategory;
    const matchQ   = !q
      || p.nome.toLowerCase().includes(q)
      || p.codigo.includes(q)
      || p.marca.toLowerCase().includes(q);
    return matchCat && matchQ;
  });

  document.getElementById("resultCount").textContent =
    items.length === PRODUCTS.length
      ? `${items.length} produtos`
      : `${items.length} de ${PRODUCTS.length} produtos`;

  const grid = document.getElementById("grid");

  if (!items.length) {
    grid.innerHTML = `
      <div class="empty" style="grid-column:1/-1">
        <span class="empty-icon">🔍</span>
        Nenhum produto encontrado para "<strong>${q || activeCategory}</strong>".
      </div>`;
    return;
  }

  grid.innerHTML = items.map(p => `
    <div class="card" onclick="openModal('${p.codigo}')">
      <div class="card-img-wrap">
        ${p.imagem
          ? `<img src="${p.imagem}" alt="${p.nome}" loading="lazy">`
          : `<div class="no-img"><span>📷</span>Sem foto disponível</div>`
        }
        <span class="card-cat-badge">${p.categoria}</span>
      </div>
      <div class="card-body">
        <div class="card-meta">
          <span class="card-code">#${p.codigo}</span>
          <span class="card-marca">${p.marca}</span>
        </div>
        <div class="card-name">${p.nome}</div>
      </div>
    </div>
  `).join("");
}

// ─────────────────────────────────────────────────────────────────────
// MODAL
// ─────────────────────────────────────────────────────────────────────
function openModal(codigo) {
  const p = PRODUCTS.find(x => x.codigo === codigo);
  if (!p) return;

  document.getElementById("modalCode").textContent  = "Código: " + p.codigo;
  document.getElementById("modalMarca").textContent = p.marca;
  document.getElementById("modalCat").textContent   = p.categoria;
  document.getElementById("modalName").textContent  = p.nome;

  const wrap = document.getElementById("modalImgWrap");
  wrap.innerHTML = p.imagem
    ? `<img src="${p.imagem}" alt="${p.nome}">`
    : `<div class="no-img"><span>📷</span>Sem foto disponível</div>`;

  const btn = document.getElementById("modalBtnDl");
  if (p.imagem) {
    btn.href = p.imagem;
    btn.style.opacity = "1";
    btn.style.pointerEvents = "auto";
  } else {
    btn.href = "#";
    btn.style.opacity = "0.35";
    btn.style.pointerEvents = "none";
  }

  document.getElementById("modalOverlay").classList.add("open");
}

function closeModal() {
  document.getElementById("modalOverlay").classList.remove("open");
}

// ─────────────────────────────────────────────────────────────────────
// EVENTOS
// ─────────────────────────────────────────────────────────────────────
document.getElementById("modalOverlay").addEventListener("click", e => {
  if (e.target.id === "modalOverlay") closeModal();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
});

// ─────────────────────────────────────────────────────────────────────
// INIT
// (Futuramente: fetch('products.json').then(r=>r.json()).then(data => { PRODUCTS = data; init(); }))
// ─────────────────────────────────────────────────────────────────────
buildCatFilters();
render();
</script>
</body>
</html>
